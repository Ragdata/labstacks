services:
  ntfy:
    image: binwiederhier/ntfy
    hostname: ntfy
    container_name: ntfy
    # security options optional - uncomment if required
    # security_opt:
    #   - apparmor:unconfined
    restart: unless-stopped
    command:
      - serve
    healthcheck: # optional: remember to adapt the host:port to your environment
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      - TZ=${TZ:-UTC}    # optional: set desired timezone
    # user: UID:GID # optional: replace with your own user/group or uid/gid
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-etc:/etc/ntfy
      # - ${BASEDIR}/files/server.yml:/etc/ntfy/server.yml:ro
      # - ${BASEDIR}/files/templates:/etc/ntfy/templates:ro
    networks:
      - ntfy
    ports:
      - ${HOST_PORT:-8810}:80

volumes:
  ntfy-cache:
    name: ntfy-cavhe
    driver: local
  ntfy-etc:
    name: ntfy-etc
    driver: local

networks:
  ntfy:
    name: ntfy
    driver: bridge
